<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="100%" stop-color="#800f2f" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ef233c" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 50 6 C 74 12 90 20 90 38 C 90 68 50 94 50 94 C 50 94 10 68 10 38 C 10 20 26 12 50 6 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>
        
  <!-- Inner Border Line -->
  <path d="M 50 12 C 70 17 84 24 84 40 C 84 64 50 87 50 87 C 50 87 16 64 16 40 C 16 24 30 17 50 12 Z" 
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
        
  <!-- Star of Life / Medical & Emergency Cross -->
  <g fill="url(#starGrad)">
    <rect x="44" y="24" width="12" height="46" rx="4" />
    <rect x="27" y="41" width="46" height="12" rx="4" />
  </g>
  
  <!-- Central Pulse Beacon Dot -->
  <circle cx="50" cy="47" r="5" fill="#ef233c" />
  <circle cx="50" cy="47" r="2.5" fill="#ffffff" />
</svg>
